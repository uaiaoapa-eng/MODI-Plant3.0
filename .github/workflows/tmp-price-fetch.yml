name: tmp-price-fetch
on:
  push:
    branches:
      - claude/tmp-price-fetch-x7
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 tmp_fetch_prices_x7.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp_price_out
          git commit -m "tmp: price data"
          git push origin HEAD:claude/tmp-price-fetch-x7
