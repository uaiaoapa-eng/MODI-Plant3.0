<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edu-agent 모드 시뮬레이터 (/chat 온톨로지 RAG)</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
    --txt:#e6edf3; --dim:#9aa7b4; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 18px 60px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1;min-width:140px}
  input[type=text],select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:5px;padding:8px 10px;font-family:var(--sans);font-size:14px}
  .chk{display:flex;align-items:center;gap:6px;margin-top:22px;font-size:13px}
  button{margin-top:14px;background:var(--accent);color:#06101f;border:0;border-radius:6px;
    padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
  .on{background:rgba(63,185,80,.16);color:var(--ok);border:1px solid var(--ok)}
  .off{background:rgba(248,81,73,.14);color:var(--bad);border:1px solid var(--bad)}
  .kv{display:flex;gap:8px;font-size:13px;margin:3px 0}
  .kv b{color:var(--dim);font-weight:600;min-width:96px}
  .chips span{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    padding:2px 8px;margin:3px 4px 0 0;font-size:12px}
  .modi span{border-color:#7a5cff;color:#c8b8ff}
  pre{background:#0a0e15;border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;
    font-family:var(--mono);font-size:12.5px;color:#c9d4e5;white-space:pre-wrap;word-break:break-word}
  h3{font-size:14px;margin:2px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .muted{color:var(--dim);font-size:13px}
  .apibar{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>모드 시뮬레이터 — /chat 온톨로지 RAG</h1>
  <p class="sub">LLM 호출 없이 <code>/chat</code>과 <b>동일한 코드</b>(prime_service)로 이 입력이
    온톨로지 RAG를 태우는지(분기)와 실제 주입되는 프라임을 그대로 보여줍니다. 비용 0.</p>

  <div class="card">
    <div class="row">
      <div style="flex:2 1 100%"><label>메시지</label>
        <input type="text" id="msg" placeholder="예: 자동차가 벽 보고 스스로 멈추게" value="자동차가 벽 보고 스스로 멈추게"></div>
    </div>
    <div class="row">
      <div><label>mode</label><select id="mode"><option>quick</option><option>design</option></select></div>
      <div><label>coding_type</label><select id="ctype"><option>react</option><option>blockly</option></select></div>
      <div><label>phase</label><select id="phase"><option>implement</option><option>design</option><option>verify</option></select></div>
      <div><label class="chk"><input type="checkbox" id="hascode"> has_code (수정 턴)</label></div>
    </div>
    <button id="run">시뮬레이션 실행</button>
    <div class="apibar" id="apibar"></div>
  </div>

  <div id="out"></div>
</div>

<script>
// 이 페이지는 메인앱(GET /simulate)이 직접 서빙하므로 동일 출처(상대경로)로 API를 호출한다.
// → 도메인(https, NPM→:18080)·직접 IP(:18080) 어디서 열어도 동작.
// 다른 정적 서버(예: :8091)에 올려 교차출처로 쓸 경우 window.API_BASE 로 오버라이드 가능.
const API_BASE = (window.API_BASE != null) ? window.API_BASE : '';
document.getElementById('apibar').textContent = 'API = ' + (API_BASE || location.origin) + '/api/simulate';
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function chips(arr, cls){
  if(!arr || !arr.length) return '<span class="muted">없음</span>';
  return '<div class="chips '+(cls||'')+'">'+arr.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>';
}

function render(d){
  if(!d.ok){ $('out').innerHTML = '<div class="card">오류: '+esc(d.reason||JSON.stringify(d))+'</div>'; return; }
  const o = d.ontology||{};
  const prereq = (o.prerequisites||[]).map(p=>p.label||p.key);
  const rel = (o.related||[]).map(r=>r.label||r.key);
  const cards = (o.cards||[]).map(c=>c.title).filter(Boolean);
  const gate = d.reuse_gate;
  const ca = d.code_action;
  $('out').innerHTML =
    '<div class="card">'+
      '<h3>분기 (intent → 온톨로지 RAG)</h3>'+
      '<div class="kv"><b>intent</b><span>'+esc(d.intent)+'</span></div>'+
      '<div class="kv"><b>온톨로지 RAG</b><span class="badge '+(ca?'on':'off')+'">'+(ca?'발동 (code_action)':'미발동')+'</span></div>'+
      '<div class="kv"><b>프라임 주입</b><span class="badge '+(d.injected?'on':'off')+'">'+(d.injected?'주입됨':'없음')+'</span></div>'+
      (d.status_msg?'<div class="kv"><b>상태 메시지</b><span>'+esc(d.status_msg)+'</span></div>':'')+
    '</div>'+
    (ca ?
    '<div class="card">'+
      '<h3>온톨로지 관계</h3>'+
      '<div class="kv"><b>핵심 개념</b><span>'+esc(o.primary?(o.primary.label||o.primary.key):'—')+'</span></div>'+
      '<div class="kv"><b>선수학습</b><span>'+ (prereq.length?esc(prereq.join(' → ')):'<span class="muted">없음</span>') +'</span></div>'+
      '<div class="kv"><b>관련 개념</b></div>'+chips(rel)+
      '<div class="kv" style="margin-top:8px"><b>MODI 하드웨어</b></div>'+chips(o.modi_modules, 'modi')+
      '<div class="kv" style="margin-top:8px"><b>참고 학습노트</b></div>'+chips(cards)+
      '<div class="kv" style="margin-top:8px"><b>유사 결과물</b><span>'+ (o.artifacts||[]).length +'건</span></div>'+
    '</div>'+
    '<div class="card">'+
      '<h3>재사용 게이트</h3>'+
      (gate?('<div class="kv"><b>결정</b><span class="badge on">'+esc(gate.decision)+'</span></div>'+
             '<div class="kv"><b>top1</b><span>'+esc(gate.top1)+'</span></div>'+
             '<div class="kv"><b>원본</b><span>'+esc(gate.source_title||'—')+'</span></div>')
            :'<div class="muted">재사용 후보 없음 (register/콜드)</div>')+
    '</div>'+
    '<div class="card">'+
      '<h3>주입 프라임 (=/chat 프롬프트에 붙는 원문)</h3>'+
      (d.prime_block?'<pre>'+esc(d.prime_block)+'</pre>':'<div class="muted">주입 블록 없음</div>')+
    '</div>'
    : '<div class="card"><div class="muted">이 턴은 코드 생성/수정 턴이 아니라 온톨로지 RAG가 발동하지 않습니다. '+
      '(질문/대화/설계 대화 턴)</div></div>');
}

async function run(){
  $('run').disabled = true;
  $('out').innerHTML = '<div class="card muted">실행 중…</div>';
  try{
    const body = {message:$('msg').value, mode:$('mode').value, coding_type:$('ctype').value,
                  phase:$('phase').value, has_code:$('hascode').checked};
    const r = await fetch(API_BASE+'/api/simulate', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    render(await r.json());
  }catch(e){
    $('out').innerHTML = '<div class="card">호출 실패: '+esc(e.message)+
      '<br><span class="muted">'+API_BASE+' 백엔드가 떠 있는지/CORS를 확인하세요.</span></div>';
  }finally{ $('run').disabled = false; }
}
$('run').addEventListener('click', run);
$('msg').addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
run();
</script>
</body>
</html>
