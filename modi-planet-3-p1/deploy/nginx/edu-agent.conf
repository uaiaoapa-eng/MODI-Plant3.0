# edu-nginx 리버스 프록시 설정 (이슈 #157 + 이중화)
#
# 목적:
#   ① 배포 교체 창과 크래시 재시작 창에 raw 502/연결거부 대신 다른 레플리카로 리트라이,
#      그래도 안 되면 점검(503) 페이지를 반환한다.
#   ② edu-agent 3 레플리카에 sticky 라우팅 — 같은 사용자는 항상 같은 레플리카로.
#   ③ SSE(/chat) 스트리밍은 버퍼링 없이 통과.
#
# 포트 정책: 각 레플리카는 호스트 포트를 노출하지 않고 컴포즈 네트워크 내부
# (expose: 8000)로만 도달 가능. 이 nginx 가 호스트 18080 을 단독으로 받아
# edu-agent-{1..8}:8000 으로 프록시한다. NPM(.102)은 기존과 동일하게
# .95:18080 을 그대로 보면 되므로 NPM 측 재설정은 불필요하다.

# ── sticky 키 결정 ───────────────────────────────────────────────────────────
# 왜 session_id 가 아니라 user_id 인가:
#   session_id 는 POST **본문(JSON)** 에 들어오므로 nginx 가 (lua 없이) 읽을 수 없다.
#   반면 user_id 는 쿼리스트링(`/chat?user_id=...`)으로 오고 헤더(X-User-Id)도 허용된다
#   (server.py get_user_id). 세션 파일도 projects/<user_id>/<session_id>.json 로
#   사용자 단위로 묶이므로, user_id 로 붙이면 한 사용자의 모든 세션이 한 레플리카에
#   모인다 — sticky 키로 오히려 session_id 보다 정확하다.
#
# 폴백 순서: ?user_id= → X-User-Id 헤더 → 클라이언트 IP.
#   ⚠ IP 폴백의 한계: 한 교실 40명이 같은 NAT IP 로 나오면 전원이 한 레플리카에
#     쏠린다. 즉 IP 폴백은 "user_id 를 안 보내는 클라이언트"에 대한 최후 수단이며,
#     프론트가 user_id 를 항상 보내는 것이 정상 경로다.
map $http_x_user_id $edu_sticky_fallback {
  default  $http_x_user_id;
  ""       $remote_addr;
}
map $arg_user_id $edu_sticky_key {
  default  $arg_user_id;
  ""       $edu_sticky_fallback;
}

upstream edu_backend {
  # consistent hash — 레플리카 1대가 빠져도 나머지 키 배치가 최대한 유지된다
  # (단순 hash 면 peer 수가 바뀔 때 전체가 재배치되어 세션이 우수수 이동한다).
  hash $edu_sticky_key consistent;

  # max_fails/fail_timeout: 연속 3회 실패한 레플리카는 10초간 후보에서 제외되고,
  # consistent hash 가 그 키들을 살아있는 레플리카로 넘긴다 = 자동 페일오버.
  server edu-agent-1:8000 max_fails=3 fail_timeout=10s;
  server edu-agent-2:8000 max_fails=3 fail_timeout=10s;
  server edu-agent-3:8000 max_fails=3 fail_timeout=10s;
  server edu-agent-4:8000 max_fails=3 fail_timeout=10s;
  server edu-agent-5:8000 max_fails=3 fail_timeout=10s;
  server edu-agent-6:8000 max_fails=3 fail_timeout=10s;
  server edu-agent-7:8000 max_fails=3 fail_timeout=10s;
  server edu-agent-8:8000 max_fails=3 fail_timeout=10s;

  # 유휴 연결 재사용 — 레플리카가 늘어난 만큼 핸드셰이크 비용을 줄인다.
  # 레플리카가 8 대라 유휴 연결 풀도 함께 키운다(대당 ~6 개).
  keepalive 48;
}

server {
  listen 8080;

  location / {
    proxy_pass http://edu_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";          # keepalive 사용을 위해 hop-by-hop 헤더 제거
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 배포 교체/크래시 창에서 무응답이면 **다른 레플리카**로 리트라이한다.
    # (레플리카가 1대였을 때는 같은 서버 재시도에 불과했지만, 이제 진짜 페일오버다.)
    #   ⚠ non_idempotent 를 넣지 않는다 — /chat 은 POST 이고 LLM 호출·과금이
    #     일어나므로, 응답이 시작된 뒤의 실패를 재시도하면 중복 생성/중복 과금이 된다.
    #     연결 자체가 안 된 경우(error/timeout/5xx)만 다음 레플리카로 넘긴다.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;

    # SSE(/chat) 스트리밍 보존 — 버퍼링 끄고 장기 연결 허용.
    #   실측(2026-08-21): 생성 턴이 동접 5 에서 94~160초, 동접 40 에서 300초 근접.
    #   이 값은 여유가 충분하나, **앞단 NPM(.102)의 proxy_read_timeout(~300s)이
    #   실질 상한**이다. 동접 40 실패의 절단 지점이 거기였다 — NPM 측 상향이 필요.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    error_page 502 503 504 /maintenance.html;
  }

  # 레플리카 상태 확인용 — LLM 토큰을 쓰지 않는 경량 엔드포인트를 그대로 통과시킨다.
  # 부하 중 이 경로가 죽는지로 "서버가 살아있나"를 판정한다(실측에 사용).
  location = /health {
    proxy_pass http://edu_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    access_log off;
  }

  # 점검 페이지 — compose 가 deploy/nginx 디렉터리를 통째로 conf.d 에 마운트하므로
  # (단일 파일 마운트의 stale inode 문제 회피, docker-compose.yml 주석 참조)
  # maintenance.html 도 같은 디렉터리에 있다. internal 이라 error_page 경유만 가능.
  location = /maintenance.html {
    root /etc/nginx/conf.d;
    internal;
  }
}
