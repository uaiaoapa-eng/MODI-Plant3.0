<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ff4547">
    <meta name="description" content="2022 개정 교육과정과 연계한 MODI Planet Web·하드웨어 프로젝트 수업 27차시">
    <title>교육과정 · MODI Planet</title>
    <link rel="icon" href="/static/assets/brand/favicon.ico">
    <link rel="stylesheet" href="/static/lms.css?v=20260824-ai-lab-nav">
  </head>
  <body>
    <a class="skip-link" href="#lmsMain">본문으로 바로가기</a>

    <div class="app-shell">
      <aside class="history-rail" aria-label="MODI Planet 메뉴">
        <div class="rail-top">
          <a class="brand" href="/" aria-label="MODI Planet 홈">
            <img class="brand-logo" src="/static/assets/brand/logo.svg" alt="MODI Planet">
          </a>

          <a class="new-start-button" href="/#create" aria-label="새 AI LAB 프로젝트 시작">
            <span aria-hidden="true">＋</span>
            <span>새 프로젝트</span>
          </a>

          <nav class="rail-nav" aria-label="주요 메뉴">
            <a href="/#home" aria-label="홈">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z"/>
                <path d="M9 21v-7h6v7"/>
              </svg>
              <span class="rail-nav-label">홈</span>
            </a>
            <a class="active" href="/lms" aria-label="교육과정" aria-current="page">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m3 6.5 9-4 9 4-9 4z"/>
                <path d="M6 9v5.5c0 1.7 2.7 3 6 3s6-1.3 6-3V9"/>
                <path d="M21 7v7"/>
              </svg>
              <span class="rail-nav-label">교육과정</span>
            </a>
            <a class="ai-lab-link" href="/#create" aria-label="AI LAB">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 3v18M3 12h18"/>
              </svg>
              <span class="rail-nav-label">AI LAB</span>
            </a>
          </nav>
        </div>

        <section class="rail-history" aria-labelledby="courseRailTitle">
          <div class="rail-section-title">
            <h2 id="courseRailTitle">난이도 바로가기</h2>
            <span aria-label="과정 3개">3</span>
          </div>
          <nav class="rail-history-list" aria-label="교육과정 탐색">
            <a class="rail-course-button" href="/lms#elementary" data-rail-level="elementary">
              <span class="rail-project-icon" aria-hidden="true">초</span>
              <span class="rail-project-copy"><strong>초급 · 초등</strong><span>5~6학년 · 실과</span></span>
            </a>
            <a class="rail-course-button" href="/lms#middle" data-rail-level="middle">
              <span class="rail-project-icon middle" aria-hidden="true">중</span>
              <span class="rail-project-copy"><strong>중급 · 중등</strong><span>1~3학년 · 정보</span></span>
            </a>
            <a class="rail-course-button" href="/lms#high" data-rail-level="high">
              <span class="rail-project-icon high" aria-hidden="true">고</span>
              <span class="rail-project-copy"><strong>고급 · 고등</strong><span>1~2학년 · 정보</span></span>
            </a>
          </nav>
        </section>

        <div class="rail-footer">
          <span class="version-dot" aria-hidden="true"></span>
          <span>MODI Planet 3.0</span>
        </div>
      </aside>

      <main id="lmsMain" class="main-content" tabindex="-1">
        <div id="appLoading" class="app-loading" role="status">
          <span class="loader" aria-hidden="true"></span>
          <strong>교육과정을 불러오고 있어요</strong>
        </div>
      </main>
    </div>

    <dialog class="plan-dialog" id="planDialog" aria-labelledby="planTitle">
      <div class="dialog-shell">
        <header class="dialog-header">
          <div>
            <p class="dialog-kicker" id="planKicker"></p>
            <h2 id="planTitle"></h2>
          </div>
          <button class="icon-button" id="closePlanButton" type="button" aria-label="교안 닫기">×</button>
        </header>
        <div class="dialog-body" id="planBody"></div>
        <footer class="dialog-footer">
          <button class="secondary-button" id="closePlanFooterButton" type="button">닫기</button>
          <button class="primary-button" id="startFromPlanButton" type="button">이 차시 수업 시작</button>
        </footer>
      </div>
    </dialog>

    <dialog class="lesson-player" id="lessonPlayer" aria-hidden="true" aria-labelledby="playerTitle" aria-describedby="playerMeta">
      <header class="player-header">
        <button class="player-exit" id="exitLessonButton" type="button" aria-label="수업 나가기">
          <span aria-hidden="true">←</span><span>과정으로</span>
        </button>
        <div class="player-title-wrap">
          <p id="playerMeta"></p>
          <h1 id="playerTitle"></h1>
        </div>
        <div class="player-tools">
          <div class="phase-track" id="phaseTrack" aria-label="수업 단계"></div>
          <span class="class-timer" id="classTimer">00:00</span>
          <a class="player-ai-lab" href="/#create" aria-label="AI LAB에서 새 프로젝트 시작">
            <span class="player-ai-lab-mark" aria-hidden="true">AI</span>
            <span class="player-ai-lab-label">AI LAB</span>
          </a>
          <button class="teacher-toggle" id="teacherToggle" type="button" aria-pressed="false">교사 노트</button>
        </div>
      </header>

      <div class="player-layout">
        <aside class="slide-rail" id="slideRail" aria-label="차시 진행 순서"></aside>

        <section class="slide-stage" aria-label="수업 슬라이드">
          <div class="slide-card" id="slideCard" tabindex="-1"></div>
          <div class="sr-only" id="lessonLive" role="status" aria-live="polite" aria-atomic="true"></div>
          <div class="mobile-player-actions" aria-label="모바일 수업 도구">
            <button class="mobile-tool-button" id="mobileTeacherToggle" type="button" aria-pressed="false">
              교사 노트
            </button>
            <button class="mobile-tool-button primary" id="studioToggle" type="button" aria-controls="learningStudio" aria-expanded="false">
              활동실 열기
            </button>
          </div>
          <aside class="teacher-note" id="teacherNote" aria-live="polite"></aside>
          <nav class="slide-controls" aria-label="슬라이드 이동">
            <button class="secondary-button" id="previousSlideButton" type="button">이전</button>
            <div class="slide-progress-wrap">
              <div class="slide-progress" id="slideProgress" role="progressbar" aria-label="차시 진행률" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1"><span></span></div>
              <span id="slideCounter"></span>
            </div>
            <button class="primary-button" id="nextSlideButton" type="button">다음</button>
          </nav>
        </section>

        <button class="studio-backdrop" id="studioBackdrop" type="button" tabindex="-1" aria-label="활동실 닫기" aria-hidden="true" disabled></button>

        <aside class="learning-studio" id="learningStudio" aria-labelledby="studioMobileTitle">
          <div class="studio-mobile-header">
            <div>
              <strong id="studioMobileTitle">수업 활동실</strong>
              <span>체크리스트·AI 예시·결과 확인</span>
            </div>
            <button id="closeStudioButton" type="button" aria-label="활동실 닫기">×</button>
          </div>
          <div class="studio-tabs" role="tablist" aria-label="작업실 탭">
            <button class="active" id="studioTabActivity" type="button" role="tab" data-studio-tab="activity" aria-controls="studioBody" aria-selected="true" tabindex="0">활동</button>
            <button id="studioTabPreview" type="button" role="tab" data-studio-tab="preview" aria-controls="studioBody" aria-selected="false" tabindex="-1">미리보기</button>
            <button id="studioTabModi" type="button" role="tab" data-studio-tab="modi" aria-controls="studioBody" aria-selected="false" tabindex="-1">MODI</button>
          </div>
          <div class="studio-body" id="studioBody" role="tabpanel" aria-live="polite"></div>
          <form class="tutor-composer" id="tutorForm">
            <label class="sr-only" for="tutorInput">AI 튜터에게 입력</label>
            <textarea id="tutorInput" rows="2" placeholder="수업 활동을 AI에게 구체적으로 말해보세요"></textarea>
            <button type="submit" aria-label="메시지 보내기">↑</button>
          </form>
        </aside>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/static/lms.js?v=20260824-ai-lab-nav" defer></script>
  </body>
</html>
